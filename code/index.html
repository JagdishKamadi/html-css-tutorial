<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <style>
      h2 {
        color: green;
      }
      form {
        background-color: whitesmoke;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Student Registration Form</h1>
      <p>Please fill in all the required details to register.</p>

      <img
        src="https://img.magnific.com/free-vector/engineer-worker-construction-worker-foreman-character-hand-drawn-cartoon-illustration_56104-2012.jpg?semt=ais_hybrid&w=740&q=80"
        alt="Student Registration"
        height="120"
      />

      <hr />
    </header>

    <main>
      <form action="submit.php" method="post">
        <fieldset>
          <legend>
            <h2>Personal Information</h2>
          </legend>

          <label for="firstName">First Name:</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            placeholder="Enter first name"
            required
            minlength="2"
            maxlength="30"
            autocomplete="given-name"
          />

          <br /><br />

          <label for="lastName">Last Name:</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            placeholder="Enter last name"
            required
            autocomplete="family-name"
          />

          <br /><br />

          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Create username"
            required
            minlength="6"
            maxlength="20"
          />

          <br /><br />

          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            minlength="8"
          />

          <br /><br />

          <label for="confirmPassword">Confirm Password:</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm password"
            required
            minlength="8"
          />

          <br /><br />

          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required />

          <br /><br />

          <label>Gender:</label>

          <input type="radio" id="male" name="gender" value="Male" required />
          <label for="male">Male</label>

          <input type="radio" id="female" name="gender" value="Female" />
          <label for="female">Female</label>

          <input type="radio" id="other" name="gender" value="Other" />
          <label for="other">Other</label>

          <br /><br />

          <label for="profile">Profile Photo:</label>
          <input type="file" id="profile" name="profile" accept="image/*" />
        </fieldset>

        <br />

        <fieldset>
          <legend><h2 style="color: green">Contact Information</h2></legend>

          <label for="email">Email Address:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
            autocomplete="email"
          />

          <br /><br />

          <label for="mobile">Mobile Number:</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter 10 digit mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
            autocomplete="tel"
          />

          <br /><br />

          <label for="alternateMobile">Alternate Mobile:</label>
          <input
            type="tel"
            id="alternateMobile"
            name="alternateMobile"
            placeholder="Alternate mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
          />

          <br /><br />

          <label for="address">Full Address:</label>
          <br />
          <textarea
            id="address"
            name="address"
            rows="4"
            cols="40"
            placeholder="Enter your complete address"
            required
          ></textarea>

          <br /><br />

          <label for="city">City:</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter city"
            required
          />

          <br /><br />

          <label for="state">State:</label>
          <select id="state" name="state" required>
            <option value="">Select State</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Telangana">Telangana</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Other">Other</option>
          </select>

          <br /><br />

          <label for="pincode">PIN Code:</label>
          <input
            type="text"
            id="pincode"
            name="pincode"
            placeholder="Enter PIN code"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />

          <br /><br />

          <label for="country">Country:</label>
          <input
            type="text"
            id="country"
            name="country"
            value="India"
            readonly
          />
        </fieldset>
        <br />

        <br />

        <fieldset>
          <legend><h2 style="color: green">Declaration</h2></legend>

          <input
            type="checkbox"
            id="terms"
            name="terms"
            value="accepted"
            required
          />

          <label for="terms">
            I confirm that all the information provided above is correct.
          </label>

          <br /><br />

          <label for="comments">Additional Comments:</label>
          <br />
          <textarea
            id="comments"
            name="comments"
            rows="3"
            cols="40"
            placeholder="Enter your comments"
          ></textarea>
        </fieldset>

        <br />

        <button type="submit">Submit Registration</button>

        <button type="reset">Reset Form</button>
      </form>
    </main>

    <hr />

    <footer>
      <p>Contact us: student@example.com</p>
      <p>&copy; 2026 Student Registration Portal. All rights reserved.</p>
    </footer>
  </body>
</html>
